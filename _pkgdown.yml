url: https://mcanzi.de/simling/

template:
  bootstrap: 5
  theme: a11y-dark
  bslib:
    bg: "#1e2830"
    fg: "#dfe6ea"
    primary: "#a9cbe0"
    secondary: "#98a8b3"
    link-color: "#f6b8a4"
    link-hover-color: "#a9cbe0"
    code-color: "#f2917a"
    border-color: "#34444f"
    navbar-bg: "#1e2830"
    base_font: "Atkinson Hyperlegible"
    heading_font: "Bricolage Grotesque"
    code_font: "JetBrains Mono"
  includes:
    in_header: <link rel="stylesheet" href="https://mcanzi.de/fonts/fonts.css">

navbar:
  structure:
    left: [intro, reference, news]
    right: [search, website, github]
  components:
    website:
      text: mcanzi.de
      href: https://mcanzi.de/
      aria-label: Massimiliano Canzi's website

